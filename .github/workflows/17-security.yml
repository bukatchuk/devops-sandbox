# Проверки безопасности: зависимости, код, образ, состав (SBOM).
# Все они здесь НЕ блокирующие по умолчанию — это осознанный выбор,
# разобранный в уроке: сначала смотрим на объём находок, потом решаем,
# что делать блокирующим.
name: 17 security

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/17-security.yml'
      - 'insecure/**'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  # SCA: уязвимости в зависимостях
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: pip install pip-audit==2.9.0

      - name: Рабочие зависимости
        id: real
        continue-on-error: true
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Заведомо старые зависимости (учебный стенд)
        id: old
        continue-on-error: true
        run: pip-audit -r insecure/requirements-old.txt --progress-spinner off

      - name: Разница
        shell: bash
        run: |
          echo "рабочие:      ${{ steps.real.outcome }}"
          echo "учебные старые: ${{ steps.old.outcome }}"

  # SAST: дефекты в коде
  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: pip install bandit==1.9.2

      # В insecure/ дефекты оставлены намеренно: урок как раз учит их находить.
      # Поэтому находки не роняют прогон (решение владельца: проверки
      # безопасности здесь — только отчёт), а попадают в сводку прогона.
      # Полный вывод bandit — в журнале шага; в сводке — только счётчики.
      - name: Анализ кода (отчёт)
        id: bandit
        continue-on-error: true
        run: bandit -q -r app insecure -f screen

      # «Ворота» урока: на высокой важности в боевом проекте сборка бы встала.
      # Здесь шаг показывает, как это выглядело бы, но прогон не ломает.
      - name: Только высокая важность — вот это уже ворота (отчёт)
        id: bandit_high
        continue-on-error: true
        run: bandit -q -r app insecure --severity-level high

      - name: Сводка по находкам
        if: always()
        shell: bash
        run: |
          {
            echo "### Bandit: учебные находки"
            echo ""
            echo "| проверка | исход |"
            echo "|---|---|"
            echo "| все находки | ${STEPS_BANDIT_OUTCOME} |"
            echo "| ворота: высокая важность | ${STEPS_BANDIT_HIGH_OUTCOME} |"
            echo ""
            echo "failure означает, что bandit нашёл дефекты в insecure/ — так и задумано."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          STEPS_BANDIT_OUTCOME: ${{ steps.bandit.outcome }}
          STEPS_BANDIT_HIGH_OUTCOME: ${{ steps.bandit_high.outcome }}

  # Сканирование образа и SBOM
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Собрать образ
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./app-image/Dockerfile
          push: false
          load: true
          tags: demo:scan

      - name: Сканировать образ
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: demo:scan
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Состав образа (SBOM в формате CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: demo:scan
          format: cyclonedx
          output: sbom.cdx.json
          scan-type: image

      - name: Что нашли и из чего состоит образ
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          scan = json.load(open("trivy.json"))
          vulns = [v for r in (scan.get("Results") or []) for v in (r.get("Vulnerabilities") or [])]
          fixable = [v for v in vulns if v.get("FixedVersion")]
          print("уязвимостей HIGH+CRITICAL: %d, из них исправимо: %d" % (len(vulns), len(fixable)))
          sbom = json.load(open("sbom.cdx.json"))
          comps = sbom.get("components") or []
          print("компонентов в SBOM: %d" % len(comps))
          kinds = {}
          for c in comps:
              kinds[c.get("type", "?")] = kinds.get(c.get("type", "?"), 0) + 1
          print("по типам: %s" % kinds)
          print("формат: %s, версия спецификации: %s" % (sbom.get("bomFormat"), sbom.get("specVersion")))
          PY

      - name: Сохранить SBOM и отчёт
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: security-reports
          path: |
            trivy.json
            sbom.cdx.json
          retention-days: 1
