# Секреты: маскирование и его границы, окружения, отсутствующие значения.
name: 13 secrets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/13-secrets.yml'

permissions:
  contents: read

jobs:
  masking:
    runs-on: ubuntu-latest
    env:
      SECRET: ${{ secrets.DEMO_SECRET }}
      MISSING: ${{ secrets.NET_TAKOGO_SEKRETA }}
    steps:
      - name: Прямая печать маскируется
        shell: bash
        run: |
          echo "значение: $SECRET"
          echo "длина: ${#SECRET}"

      - name: А преобразования — нет
        shell: bash
        run: |
          echo "base64:    $(printf '%s' "$SECRET" | base64)"
          echo "наоборот:  $(printf '%s' "$SECRET" | rev)"
          echo "первые 6:  ${SECRET:0:6}"
          echo "sha256:    $(printf '%s' "$SECRET" | sha256sum | cut -c1-16)"

      - name: Несуществующий секрет — пустая строка, а не ошибка
        shell: bash
        run: |
          echo "MISSING=[${MISSING}] длина ${#MISSING}"
          if [ -z "$MISSING" ]; then echo "шаг продолжает работать как ни в чём не бывало"; fi

      - name: Своё значение можно замаскировать самому
        shell: bash
        run: |
          computed="proizvodnaya-ot-sekreta-12345"
          echo "::add-mask::$computed"
          echo "после add-mask: $computed"

  # Секреты окружения доступны только джобе, объявившей это окружение.
  environment-secret:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Секрет с тем же именем в окружении
        env:
          SECRET: ${{ secrets.DEMO_SECRET }}
        shell: bash
        run: |
          echo "значение: $SECRET"
          echo "длина: ${#SECRET} (сравните с длиной в джобе masking)"
