# Артефакты: единственный штатный способ передать ФАЙЛ из джобы в джобу.
name: 07 artifacts

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/07-artifacts.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Собрать «артефакт»
        id: meta
        run: |
          mkdir -p out
          echo "сборка ${{ github.run_number }} от $(date -u +%FT%TZ)" > out/build.txt
          head -c 5000000 /dev/urandom > out/payload.bin   # 5 МБ «бинарника»
          echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          ls -l out
        shell: bash

      - name: Положить в артефакты
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-output
          path: out/
          retention-days: 1

  # Джоба проверяет, что файла из build нет, а артефакт — есть.
  use:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Файл из соседней джобы
        run: |
          if [ -f out/build.txt ]; then echo "файл на месте — джобы делят диск"; else echo "файла нет"; fi
        shell: bash

      - name: Забрать артефакт
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: build-output
          path: incoming/

      - name: Что пришло
        run: |
          ls -l incoming/
          cat incoming/build.txt
          echo "версия из outputs: ${NEEDS_BUILD_OUTPUTS_VERSION}"
        shell: bash
        env:
          NEEDS_BUILD_OUTPUTS_VERSION: ${{ needs.build.outputs.version }}

  # Джоба, которая должна выполниться даже при падении предыдущей.
  report:
    runs-on: ubuntu-latest
    needs: [build, use]
    if: always()
    steps:
      - name: Итоги
        run: |
          echo "build: ${{ needs.build.result }}"
          echo "use:   ${{ needs.use.result }}"
        shell: bash
