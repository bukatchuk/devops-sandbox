# Кэш: что он даёт и чего не делает.
# Воркфлоу запускается дважды подряд — первый прогон кэш создаёт, второй берёт.
name: 06 cache

on:
  workflow_dispatch:
    inputs:
      use_cache:
        description: 'включать ли кэш'
        required: false
        default: 'yes'
        type: choice
        options: ['yes', 'no']
  push:
    paths:
      - '.github/workflows/06-cache.yml'

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'

      # Ключ включает содержимое файла зависимостей: изменился файл — изменился
      # ключ, и кэш не подойдёт. Так и задумано.
      - name: Кэш колёс pip
        id: cache
        if: inputs.use_cache != 'no'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py313-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py313-

      - name: Попадание в кэш
        run: echo "cache-hit=[${STEPS_CACHE_OUTPUTS_CACHE_HIT}] (пусто = кэша не было или он выключен)"
        env:
          STEPS_CACHE_OUTPUTS_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}

      - name: Установка зависимостей с замером
        run: |
          start=$(date +%s%3N)
          pip install -r requirements.txt > /tmp/pip.log 2>&1
          end=$(date +%s%3N)
          echo "установка заняла $((end - start)) мс"
          echo "скачано колёс: $(grep -c '^  Downloading' /tmp/pip.log || echo 0)"
          echo "взято из кэша: $(grep -c 'Using cached' /tmp/pip.log || echo 0)"
        shell: bash

      - name: Размер кэша pip на диске
        run: du -sh ~/.cache/pip 2>/dev/null || echo "каталога нет"
