# Сборка образа в пайплайне и публикация в реестр.
# Реестр здесь локальный (сервисный контейнер registry:3 на раннере):
# урок показывает механику, ничего не оставляя снаружи.
name: 15 build and publish

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/15-build-publish.yml'
      - 'app-image/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v7

      # buildx с сетью хоста: иначе сборщик не достучится до localhost:5000
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      # Схема тегов: metadata-action собирает их из события и коммита
      - name: Посчитать теги и метки
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: localhost:5000/demo
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Что нагенерировала схема тегов
        shell: bash
        run: |
          echo "теги:"
          printf '%s\n' '${{ steps.meta.outputs.tags }}' | sed 's/^/  /'
          echo "метки:"
          printf '%s\n' '${{ steps.meta.outputs.labels }}' | sed 's/^/  /'

      - name: Сборка и публикация (первый раз, кэш пуст)
        id: first
        uses: docker/build-push-action@v7
        with:
          # Контекст — корень репозитория: код лежит там, а Dockerfile отдельно.
          # Путать эти две вещи — типичная ошибка, она стоила одного прогона.
          context: .
          file: ./app-image/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Что оказалось в реестре
        shell: bash
        run: |
          echo "репозитории: $(curl -s http://localhost:5000/v2/_catalog)"
          echo "теги:        $(curl -s http://localhost:5000/v2/demo/tags/list)"
          echo "digest образа из шага сборки: ${{ steps.first.outputs.digest }}"

      - name: Что на самом деле лежит под тегом
        shell: bash
        run: |
          set -euo pipefail
          ACCEPT='application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json'
          digest='${{ steps.first.outputs.digest }}'
          curl -s -H "Accept: $ACCEPT" "http://localhost:5000/v2/demo/manifests/${digest}" -o /tmp/top.json
          echo "тип верхнего объекта: $(jq -r '.mediaType' /tmp/top.json)"
          echo "записей внутри: $(jq -r '.manifests | length // 0' /tmp/top.json)"
          jq -r '.manifests[]? | "  \(.mediaType) platform=\(.platform.os)/\(.platform.architecture)"' /tmp/top.json
          # Записи с platform unknown/unknown — это удостоверение сборки, а не образ.
          img=$(jq -r '.manifests[]? | select(.platform.architecture != "unknown") | .digest' /tmp/top.json | head -1)
          if [ -z "$img" ]; then img="$digest"; fi
          curl -s -H "Accept: $ACCEPT" "http://localhost:5000/v2/demo/manifests/${img}" -o /tmp/manifest.json
          cfg=$(jq -r '.config.digest' /tmp/manifest.json)
          curl -s "http://localhost:5000/v2/demo/blobs/${cfg}" -o /tmp/config.json
          echo "метки в конфигурации образа:"
          jq -r '.config.Labels // {} | to_entries[] | "  \(.key) = \(.value)"' /tmp/config.json \
            | grep -E 'revision|source|created|version' || echo "  меток нет"
          echo "коммит прогона: ${{ github.sha }}"

      - name: Неизменяемый указатель против подвижного тега
        shell: bash
        run: |
          set -euo pipefail
          for t in latest main; do
            d=$(curl -sI -H 'Accept: application/vnd.oci.image.index.v1+json' \
                "http://localhost:5000/v2/demo/manifests/$t" \
                | tr -d '\r' | awk -F': ' '/[Dd]ocker-[Cc]ontent-[Dd]igest/ {print $2}')
            echo "  тег $t -> $d"
          done
          echo "  digest из сборки -> ${{ steps.first.outputs.digest }}"

      - name: Повторная сборка того же самого (кэш уже есть)
        id: second
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./app-image/Dockerfile
          push: true
          tags: localhost:5000/demo:repeat
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Одинаковый ли получился образ и почему
        shell: bash
        run: |
          set -euo pipefail
          echo "первая сборка:  ${{ steps.first.outputs.digest }}"
          echo "вторая сборка:  ${{ steps.second.outputs.digest }}"
          ACCEPT='application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json'
          # Сравниваем не сами образы, а их конфигурации: слои-то кэшированы
          for pair in "latest:${{ steps.first.outputs.digest }}" "repeat:${{ steps.second.outputs.digest }}"; do
            name=${pair%%:*}; dg=${pair#*:}
            curl -s -H "Accept: $ACCEPT" "http://localhost:5000/v2/demo/manifests/${dg}" -o /tmp/t.json
            img=$(jq -r '.manifests[]? | select(.platform.architecture != "unknown") | .digest' /tmp/t.json | head -1)
            [ -n "$img" ] || img="$dg"
            curl -s -H "Accept: $ACCEPT" "http://localhost:5000/v2/demo/manifests/${img}" -o /tmp/m.json
            cfg=$(jq -r '.config.digest' /tmp/m.json)
            curl -s "http://localhost:5000/v2/demo/blobs/${cfg}" -o "/tmp/cfg-${name}.json"
            echo "--- $name ---"
            echo "  слои:  $(jq -r '.rootfs.diff_ids | join(",")' "/tmp/cfg-${name}.json" | cut -c1-70)"
            echo "  метки: $(jq -r '.config.Labels // {} | length' "/tmp/cfg-${name}.json") штук"
          done
          echo "слои совпадают: $(cmp -s <(jq -S '.rootfs' /tmp/cfg-latest.json) <(jq -S '.rootfs' /tmp/cfg-repeat.json) && echo да || echo нет)"
          echo "конфигурации совпадают: $(cmp -s <(jq -S 'del(.created,.history)' /tmp/cfg-latest.json) <(jq -S 'del(.created,.history)' /tmp/cfg-repeat.json) && echo да || echo нет)"

  # Отдельная джоба: тот же Dockerfile, но две платформы.
  multiplatform:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v7

      # Для чужой архитектуры нужен эмулятор — его ставит QEMU-действие
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Сборка под одну платформу (для сравнения)
        id: one
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./app-image/Dockerfile
          push: true
          tags: localhost:5000/demo:amd64-only
          platforms: linux/amd64

      - name: Сборка под две платформы
        id: two
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./app-image/Dockerfile
          push: true
          tags: localhost:5000/demo:multi
          platforms: linux/amd64,linux/arm64

      - name: Что оказалось под тегом multi
        shell: bash
        run: |
          set -euo pipefail
          ACCEPT='application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json'
          curl -s -H "Accept: $ACCEPT" http://localhost:5000/v2/demo/manifests/multi -o /tmp/multi.json
          echo "тип: $(jq -r .mediaType /tmp/multi.json), записей: $(jq -r '.manifests | length' /tmp/multi.json)"
          jq -r '.manifests[] | "  \(.platform.os)/\(.platform.architecture)  \(.size) байт  \(.digest[0:19])"' /tmp/multi.json
          echo "для сравнения тег amd64-only:"
          curl -s -H "Accept: $ACCEPT" http://localhost:5000/v2/demo/manifests/amd64-only -o /tmp/one.json
          jq -r '.manifests[] | "  \(.platform.os)/\(.platform.architecture)"' /tmp/one.json
